name: Notify search engines (IndexNow)

on:
  # fires when Vercel reports a finished deployment
  deployment_status:
  # or run it by hand from the Actions tab
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every page in the sitemap (not just recently changed ones)"
        type: boolean
        default: false

jobs:
  indexnow:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit changed URLs
        run: node scripts/indexnow.mjs
        env:
          ALL: ${{ inputs.all || 'false' }}
